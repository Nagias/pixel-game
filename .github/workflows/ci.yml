# CI chạy đúng một lệnh như máy local: `npm run check`.
# Tên job "check" là tên mà luật bảo vệ nhánh main yêu cầu phải xanh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR: các lần chạy của cùng một nhánh PR chung một nhóm → đẩy commit mới thì hủy lần chạy cũ (đỡ tốn).
# main (sự kiện push): head_ref rỗng → nhóm là run_id riêng của từng lần chạy → không bao giờ bị hủy
# hay bị thay chỗ khi xếp hàng, nên commit gộp nào cũng được CI xác nhận.
# Mẫu chính thức trong tài liệu GitHub Actions ("cancel on pull_request events only").
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Ghim phiên bản: ubuntu-latest đang tự chuyển sang Ubuntu 26 — xem DEBT-010.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Tải Chromium cho test E2E
        run: npm run e2e:setup -- --with-deps

      - name: Kiểm tra toàn bộ (format, lint, kiểu, unit, build, E2E)
        run: npm run check

      # Đợt 0: bảng mô phỏng cân bằng (so với mục tiêu độ khó) in vào tóm tắt job — PR nào đổi cân bằng
      # cũng có số để xem. 200 ván cho nhanh; test cân bằng thật (500 ván) đã chạy trong `npm run check`.
      - name: Bảng mô phỏng cân bằng vào tóm tắt job
        if: ${{ !cancelled() }}
        run: npm run sim --silent -- --games 200 >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu ảnh chụp và báo cáo E2E làm bằng chứng
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
